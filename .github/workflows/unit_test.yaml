name: Unit tests

# Runs on every pull request and on every push to main (which includes merges).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: unit-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
